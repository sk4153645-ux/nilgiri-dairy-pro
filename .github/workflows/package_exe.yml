name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [ develop, main ]

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller kivy_deps.angle kivy_deps.sdl2 kivy_deps.glew

    - name: Build Executable with PyInstaller
      run: |
        python -m PyInstaller --noconfirm --onedir --windowed `
          --name "NilgiriDairyPro" `
          --add-data "src;src" `
          --hidden-import "kivy" `
          --hidden-import "kivy.core.window" `
          --hidden-import "kivy.core.image" `
          --hidden-import "kivy.core.text" `
          --hidden-import "kivy.app" `
          --hidden-import "kivy.uix" `
          src/main.py

    - name: Compress Build Artifact
      run: |
        Compress-Archive -Path dist/NilgiriDairyPro -DestinationPath NilgiriDairyPro_Windows.zip

    - name: Upload EXE Artifact
      uses: actions/upload-artifact@v4
      with:
        name: NilgiriDairyPro-Windows
        path: NilgiriDairyPro_Windows.zip
